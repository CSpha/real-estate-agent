services:
  postgres:
    image: postgres:16
    container_name: real_estate_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-realestate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-realestate}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-realestate}
      DB_USER: ${DB_USER:-realestate}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    command:
      - sh
      - -c
      - python -m alembic upgrade head && uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  shadow-runner:
    profiles: ["shadow"]
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-realestate}
      DB_USER: ${DB_USER:-realestate}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:?Set RENTCAST_API_KEY in .env}
      SHADOW_INTERVAL_HOURS: ${SHADOW_INTERVAL_HOURS:-168}
      SHADOW_RETRY_HOURS: ${SHADOW_RETRY_HOURS:-6}
      SHADOW_INITIAL_DELAY_HOURS: ${SHADOW_INITIAL_DELAY_HOURS:-0}
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python -m app.shadow.scheduler
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
