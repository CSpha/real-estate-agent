services:
  postgres:
    image: postgres:16
    container_name: real_estate_postgres
    environment:
      POSTGRES_USER: ${DB_USER-${POSTGRES_USER:-realestate}}
      POSTGRES_PASSWORD: ${DB_PASSWORD-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}
      POSTGRES_DB: ${DB_NAME-${POSTGRES_DB:-realestate}}
    ports:
      - "${DB_PORT-${POSTGRES_PORT:-5432}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME-${POSTGRES_DB:-realestate}}
      DB_USER: ${DB_USER-${POSTGRES_USER:-realestate}}
      DB_PASSWORD: ${DB_PASSWORD-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}
      SHADOW_INTERVAL_HOURS: ${SHADOW_INTERVAL_HOURS:-72}
      SHADOW_RETRY_HOURS: ${SHADOW_RETRY_HOURS:-6}
      API_STATEMENT_TIMEOUT_MS: ${API_STATEMENT_TIMEOUT_MS:-5000}
    command:
      - sh
      - -c
      - python -m alembic upgrade head && uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  shadow-runner:
    profiles: ["shadow"]
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME-${POSTGRES_DB:-realestate}}
      DB_USER: ${DB_USER-${POSTGRES_USER:-realestate}}
      DB_PASSWORD: ${DB_PASSWORD-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:?Set RENTCAST_API_KEY in .env}
      SHADOW_INTERVAL_HOURS: ${SHADOW_INTERVAL_HOURS:-72}
      SHADOW_RETRY_HOURS: ${SHADOW_RETRY_HOURS:-6}
      SHADOW_INITIAL_DELAY_HOURS: ${SHADOW_INITIAL_DELAY_HOURS:-0}
      SHADOW_ENABLE_RENTCAST_API_CALLS: ${SHADOW_ENABLE_RENTCAST_API_CALLS:-false}
      SHADOW_RENTCAST_MIN_HOURS: ${SHADOW_RENTCAST_MIN_HOURS:-60}
      SHADOW_RENTCAST_MONTHLY_REQUEST_LIMIT: ${SHADOW_RENTCAST_MONTHLY_REQUEST_LIMIT:-40}
      SHADOW_PMMS_REFRESH_ENABLED: ${SHADOW_PMMS_REFRESH_ENABLED:-true}
      PROVIDER_FAILURE_THRESHOLD: ${PROVIDER_FAILURE_THRESHOLD:-2}
      RENTCAST_BUDGET_WARN_PERCENT: ${RENTCAST_BUDGET_WARN_PERCENT:-80}
      DB_SIZE_WARN_MB: ${DB_SIZE_WARN_MB:-5000}
      # Operational warnings only; listing-alert webhooks are never passed here.
      SLACK_OPS_WEBHOOK_URL: ${SLACK_OPS_WEBHOOK_URL:-}
      # Pinged after each successful run so an external monitor can warn when runs stop.
      SHADOW_HEARTBEAT_URL: ${SHADOW_HEARTBEAT_URL:-}
      # text (default, human-readable) or json (one object per line).
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # Marks synced listings alert-eligible; the runner still never sends alerts.
      LIVE_ALERTS_ENABLED: ${LIVE_ALERTS_ENABLED:-false}
    volumes:
      - ./data/shadow-runner:/app/data
    command:
      - sh
      - -c
      - python -m alembic upgrade head && python -m app.shadow.scheduler
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.shadow.health"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30s
    restart: unless-stopped

  # The only service that receives the listing-alert webhook.
  alert-worker:
    profiles: ["alerts"]
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME-${POSTGRES_DB:-realestate}}
      DB_USER: ${DB_USER-${POSTGRES_USER:-realestate}}
      DB_PASSWORD: ${DB_PASSWORD-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}
      LIVE_ALERTS_ENABLED: ${LIVE_ALERTS_ENABLED:-false}
      # The worker itself refuses to start without it.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_OPS_WEBHOOK_URL: ${SLACK_OPS_WEBHOOK_URL:-}
      ALERT_WORKER_INTERVAL_MINUTES: ${ALERT_WORKER_INTERVAL_MINUTES:-15}
    volumes:
      - ./data/alert-worker:/app/data
    command: ["python", "-m", "app.alerts.live_alert_worker"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: scripts/backup.Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME-${POSTGRES_DB:-realestate}}
      DB_USER: ${DB_USER-${POSTGRES_USER:-realestate}}
      PGPASSWORD: ${DB_PASSWORD-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      # "true" only when BACKUP_OFFSITE_DIR is set and non-empty.
      BACKUP_OFFSITE_ENABLED: ${BACKUP_OFFSITE_DIR:+true}
    volumes:
      - ./data/backups:/backups
      # Unset -> an unused, ignored placeholder folder; the script skips it.
      - ${BACKUP_OFFSITE_DIR:-./data/backups-offsite-disabled}:/offsite
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backup-verify:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: scripts/backup.Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME-${POSTGRES_DB:-realestate}}
      DB_USER: ${DB_USER-${POSTGRES_USER:-realestate}}
      PGPASSWORD: ${DB_PASSWORD-${POSTGRES_PASSWORD:?Set DB_PASSWORD or POSTGRES_PASSWORD in .env}}
      BACKUP_DIR: /backups
      BACKUP_VERIFY_INTERVAL_SECONDS: ${BACKUP_VERIFY_INTERVAL_SECONDS:-604800}
      BACKUP_VERIFY_RETRY_SECONDS: ${BACKUP_VERIFY_RETRY_SECONDS:-3600}
    volumes:
      # Writable only so a passed verification can record .last_verified,
      # which retention uses to protect the newest verified dump.
      - ./data/backups:/backups
    command: ["bash", "/app/scripts/verify_backups_loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      backup:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
